version: "3.9"
name: nursy

services:
  # MySQL 8.0 Database
  db:
    image: mysql:8.0
    container_name: nursy_db
    environment:
      MYSQL_ROOT_PASSWORD: 83@Wael1
      MYSQL_DATABASE: ${DB_NAME:-nursery_db}
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./nursery-system/backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p83@Wael1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - app_net
    restart: unless-stopped

  # Redis Cache (for sessions, rate limiting, etc.)
  redis:
    image: redis:7-alpine
    container_name: nursy_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - app_net
    restart: unless-stopped

  # Backend API (FastAPI)
  backend:
    build:
      context: ./nursery-system/backend
      dockerfile: Dockerfile.local
      args:
        - PYTHON_VERSION=3.11
    container_name: nursy_backend
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=mysql+pymysql://root:83%40Wael1@db:3306/${DB_NAME:-nursery_db}?charset=utf8mb4
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password123}@redis:6379/0
      - API_PORT=${API_PORT:-8000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4173}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./nursery-system/backend/app:/app/app:ro
      - ./nursery-system/backend/storage:/app/storage
      - ./nursery-system/backend/logs:/app/logs
      - ./nursery-system/backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - app_net
    restart: unless-stopped
    profiles:
      - ""
      - dev
      - test

  # Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: ./nursery-system/frontend
      dockerfile: Dockerfile.local
      args:
        - NODE_VERSION=18
        - VITE_API_BASE_URL=/api
    container_name: nursy_frontend
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=/api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - app_net
    restart: unless-stopped
    profiles:
      - ""
      - dev

  # Adminer (Database GUI)
  adminer:
    image: adminer:latest
    container_name: nursy_adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - app_net
    restart: unless-stopped
    profiles:
      - dev

  # Test runner (for CI/CD)
  test:
    build:
      context: ./nursery-system/backend
      dockerfile: Dockerfile.test
    container_name: nursy_test
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+pymysql://root:83%40Wael1@db:3306/${DB_NAME:-nursery_db}_test?charset=utf8mb4
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password123}@redis:6379/1
      - TESTING=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./nursery-system/backend:/app
      - ./test-reports:/test-reports
    command: pytest -v --cov=app --cov-report=html:/test-reports/coverage --cov-report=term
    networks:
      - app_net
    profiles:
      - test

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_net:
    driver: bridge
