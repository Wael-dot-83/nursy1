name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'nursery-system/backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'nursery-system/backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('nursery-system/backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      working-directory: ./nursery-system/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting with Ruff
      working-directory: ./nursery-system/backend
      run: |
        pip install ruff
        ruff check app/

    - name: Run tests with pytest
      working-directory: ./nursery-system/backend
      run: |
        pytest --cov=app --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./nursery-system/backend/coverage.xml
        flags: backend
        name: backend-coverage

    - name: Check minimum coverage
      working-directory: ./nursery-system/backend
      run: |
        pytest --cov=app --cov-fail-under=40
