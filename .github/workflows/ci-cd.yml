name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./nursery-system/backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio bandit safety
      
      - name: Run security scan (Bandit)
        working-directory: ./nursery-system/backend
        run: bandit -r app/ -f json -o bandit-report.json || true
      
      - name: Check dependencies (Safety)
        working-directory: ./nursery-system/backend
        run: safety check --json || true
      
      - name: Run tests with coverage
        working-directory: ./nursery-system/backend
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/test_db
          JWT_SECRET_KEY: test_secret_key_min_32_characters_long
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./nursery-system/backend/coverage.xml
          flags: backend

  # Frontend Tests
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./nursery-system/frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./nursery-system/frontend
        run: npm ci
      
      - name: Run linter
        working-directory: ./nursery-system/frontend
        run: npm run lint || true
      
      - name: Run security audit
        working-directory: ./nursery-system/frontend
        run: npm audit --audit-level=moderate || true
      
      - name: Run tests
        working-directory: ./nursery-system/frontend
        run: npm test -- --coverage
      
      - name: Build
        working-directory: ./nursery-system/frontend
        run: npm run build

  # Build and Push Docker Images
  build-and-push:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./nursery-system/backend
          file: ./nursery-system/backend/Dockerfile.production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
      
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
      
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./nursery-system/frontend
          file: ./nursery-system/frontend/Dockerfile.production
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  # Deploy to Production
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://nursery.example.com
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to production server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/nursery-system
            docker-compose -f docker-compose.production.yml pull
            docker-compose -f docker-compose.production.yml up -d
            docker-compose -f docker-compose.production.yml exec -T backend alembic upgrade head
      
      - name: Health check
        run: |
          sleep 30
          curl -f https://nursery.example.com/health || exit 1
      
      - name: Notify deployment
        if: success()
        run: echo "Deployment successful!"
