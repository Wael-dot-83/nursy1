version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nursery_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-nursery_db}
      POSTGRES_USER: ${DATABASE_USER:-nursery_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-nursery_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nursery_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nursery_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nursery_network

  # Backend API
  backend:
    build:
      context: ./nursery-system/backend
      dockerfile: Dockerfile.production
    container_name: nursery_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-nursery_user}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-nursery_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nursery_network

  # Frontend
  frontend:
    build:
      context: ./nursery-system/frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.nursery.example.com}
    container_name: nursery_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nursery_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nursery_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nursery_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  nursery_network:
    driver: bridge
