version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nursery-backend
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: sqlite:///./nursery.db
      SECRET_KEY: nG4kbjO88riwtf2hE3rvODIOw87N-rkfnOFFrs7FCG0
      JWT_ACCESS_SECRET: nG4kbjO88riwtf2hE3rvODIOw87N-rkfnOFFrs7FCG0-access
      JWT_REFRESH_SECRET: nG4kbjO88riwtf2hE3rvODIOw87N-rkfnOFFrs7FCG0-refresh
      DEBUG: True
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:4173,http://localhost:4174,http://localhost:4175
    volumes:
      - ./backend/nursery.db:/app/nursery.db
      - ./backend/storage:/app/storage
      - ./backend/logs:/app/logs
    networks:
      - nursery-network
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nursery-frontend
    ports:
      - "4173:80"
    environment:
      VITE_API_URL: http://localhost:8002
    depends_on:
      - backend
    networks:
      - nursery-network
    restart: unless-stopped

networks:
  nursery-network:
    driver: bridge
